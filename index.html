<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lark Vineyard</title>
  <meta name="description" content="Lark Vineyard — a family-owned micro-vineyard in Thaxted, Essex. Coming soon.">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=ranade@400,500&amp;display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/site.js"></script>
</head>
<body>
  <main class="landing">
    <button
      class="landing__gate-trigger"
      type="button"
      data-code-trigger
      aria-haspopup="dialog"
      aria-label="Lark Vineyard — enter the website">
      <img
        class="landing__logo"
        src="logos/Primary%20Logo_Twilight%20Pinot%20Noir.png"
        alt=""
        width="4167"
        height="4303">
    </button>
    <p class="landing__message">Coming soon...</p>
  </main>

  <footer class="footer">
    <p class="footer__copyright">&copy; 2026, E.W.Davies Farms Ltd.</p>
    <a
      class="footer__social"
      href="https://www.instagram.com/larkvineyard/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Lark Vineyard on Instagram">
      <img class="footer__social-icon" src="logos/instagram.png" alt="" width="600" height="600">
    </a>
  </footer>

  <dialog class="gate" data-code-dialog aria-labelledby="gate-title">
    <form class="gate__form" data-code-form novalidate>
      <h2 class="gate__title" id="gate-title">Secret code</h2>
      <p class="gate__hint">Enter the code to uncork the rest of the website.</p>

      <label class="gate__label" for="gate-code">Code</label>
      <input
        class="gate__input"
        id="gate-code"
        name="code"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        required>

      <p class="gate__error" data-code-error role="alert"></p>

      <div class="gate__actions">
        <button class="gate__button gate__button--quiet" type="button" data-code-cancel>Cancel</button>
        <button class="gate__button" type="submit">Enter</button>
      </div>
    </form>
  </dialog>
</body>
</html>
