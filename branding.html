<!DOCTYPE html>
<html lang="en-GB" data-requires-code="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lark Vineyard — Branding</title>
  <meta name="description" content="Lark Vineyard — a family-owned micro-vineyard and winery in northwest Essex.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=ranade@400,500&amp;display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/site.js"></script>
</head>
<body>
  <header class="navbar">
    <a class="navbar__home" href="home.html" aria-label="Lark Vineyard home">
      <img
        class="navbar__logo"
        src="logos/Horizontal_Twilight%20Pinot%20Noir.png"
        alt=""
        width="8751"
        height="1878">
    </a>

    <nav class="navbar__nav" aria-label="Main">
      <ul class="navbar__list">
        <li><a class="navbar__link" href="home.html">Home</a></li>
        <li><a class="navbar__link" href="about.html">About</a></li>
        <li><a class="navbar__link" href="vineyard.html">Vineyard</a></li>
        <li><a class="navbar__link" href="wines.html">Wines</a></li>
        <li><a class="navbar__link" href="branding.html" aria-current="page">Branding</a></li>
        <li><a class="navbar__link" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <a
      class="page__link"
      href="https://studiocristaline.com/"
      target="_blank"
      rel="noopener noreferrer">
      <img
        class="page__wordmark"
        src="photos/Branding/Studio%20Cristaline.svg"
        alt="Studio Cristaline"
        width="2000"
        height="78">
    </a>

    <video
      class="page__video"
      controls
      preload="metadata"
      width="1440"
      height="864">
      <source src="photos/Branding/lark-video-1440x864.mp4" type="video/mp4">
      <p>Your browser can't play embedded video.
        <a class="page__text-link" href="photos/Branding/lark-video-1440x864.mp4">Download the Lark Vineyard video</a>.</p>
    </video>
  </main>

  <footer class="footer">
    <p class="footer__copyright">&copy; 2026, E.W.Davies Farms Ltd.</p>
    <a
      class="footer__social"
      href="https://www.instagram.com/larkvineyard/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Lark Vineyard on Instagram">
      <img class="footer__social-icon" src="logos/instagram.png" alt="" width="600" height="600">
    </a>
  </footer>
</body>
</html>
